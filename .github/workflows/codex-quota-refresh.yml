name: Codex quota refresh reminder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codex-quota-refresh.yml"
  schedule:
    # Beijing time: 10:30, 15:30, 20:30.
    # GitHub schedules use UTC by default: 02:30, 07:30, 12:30 UTC.
    - cron: "30 2,7,12 * * *"

permissions:
  contents: read
  issues: write

jobs:
  notify:
    name: Send refresh reminder
    runs-on: ubuntu-latest
    steps:
      - name: Write reminder to workflow summary
        env:
          MESSAGE: "您的codex五小时额度已刷新！"
          TZ: Asia/Shanghai
        run: |
          beijing_time="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "$MESSAGE"
          {
            echo "## Codex quota refresh reminder"
            echo ""
            echo "$MESSAGE"
            echo ""
            echo "Beijing time: $beijing_time"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record reminder in a GitHub issue
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = "codex-quota-refresh";
            const title = "Codex 五小时额度刷新提醒";
            const message = "您的codex五小时额度已刷新！";
            const trigger = context.eventName === "schedule"
              ? `schedule: ${context.payload.schedule}`
              : context.eventName;
            const beijingTime = new Intl.DateTimeFormat("zh-CN", {
              timeZone: "Asia/Shanghai",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: false
            }).format(new Date());

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: "0969da",
                description: "Automated Codex quota refresh reminders"
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: labelName,
              per_page: 100
            });
            let issue = issues.find((item) => item.title === title && !item.pull_request);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: [
                  "此 issue 由 GitHub Actions 自动维护，用于记录 Codex 五小时额度刷新提醒。",
                  "",
                  "计划时间：北京时间每天 10:30、15:30、20:30。",
                  "",
                  "如果你 watch 这个仓库或订阅此 issue，GitHub 会按你的通知设置发送提醒。"
                ].join("\n"),
                labels: [labelName]
              });
              issue = created.data;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: [
                message,
                "",
                `北京时间：${beijingTime}`,
                `触发来源：${trigger}`
              ].join("\n")
            });

            core.notice(`Reminder recorded in issue #${issue.number}.`);
