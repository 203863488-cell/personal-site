name: Deploy static portfolio snapshot

on:
  push:
    branches:
      - portfolio-static-20260617
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish current static site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout snapshot
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp -R assets images index.html favicon.svg icons.svg resume.pdf dist/
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
