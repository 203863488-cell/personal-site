    <style>
      .app-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #1f2933;
        background: #f8faf7;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .app-boot__content {
        width: min(28rem, 100%);
      }
      .app-boot__brand {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
      }
      .app-boot__status {
        margin: 0.75rem 0 0;
        color: #6b7280;
        font-size: 0.9rem;
      }
      .app-boot__line {
        height: 3px;
        margin-top: 1.25rem;
        overflow: hidden;
        background: #d8e0e7;
      }
      .app-boot__line::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        background: #4f9cf9;
        animation: boot-progress 1.25s ease-in-out infinite alternate;
      }
      @keyframes boot-progress {
        from { transform: translateX(-15%); }
        to { transform: translateX(180%); }
      }
      /* Prevent a stale cached image placeholder from washing out dark tiles. */
      .content-auto article > img {
        background-color: transparent;
      }
    </style>
    <script>
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || ""))) {
        document.documentElement.classList.add("low-bandwidth");
      }
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register("/personal-site/sw.js")
            .then((registration) => registration.update())
            .catch((error) => {
              console.warn("Service worker registration failed:", error);
            });
        });
      }
    </script>
