<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">图片暂未载入</title>
  <desc id="description">网络恢复后重新打开页面即可载入项目图片。</desc>
  <rect width="1200" height="720" fill="#eef3f6"/>
  <path d="M0 520C180 460 280 590 460 530s300-90 480-20 210 40 260 18" fill="none" stroke="#bfd0df" stroke-width="3"/>
  <path d="M0 250h260c90 0 90-90 180-90h760" fill="none" stroke="#9bc9ff" stroke-width="3" stroke-dasharray="18 16"/>
  <g fill="#425466" font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="600" y="340" font-size="42" font-weight="600">项目图片正在等待网络</text>
    <text x="600" y="400" font-size="24" fill="#6b7280">页面内容仍可继续浏览</text>
  </g>
</svg>
